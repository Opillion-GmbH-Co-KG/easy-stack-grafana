[database]
type = mysql
host = mysql:3305
name = database_grafana
user = admin
password = test123


[paths]
provisioning = /etc/grafana/provisioning

[server]
enable_gzip = true
# To add HTTPS support:
protocol = https
#;http_addr =
http_port = 3001
domain = localhost
enforce_domain = false
root_url = https://localhost:3001
router_logging = false
static_root_path = public
cert_file = /etc/grafana/grafana.crt
cert_key = /etc/grafana/grafana.key

[security]
# If you want to embed grafana into an iframe for example
allow_embedding = true

[users]
default_theme = dark

[plugins]
allow_loading_unsigned_plugins = grafana-clock-panel

